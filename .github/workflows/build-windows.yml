name: Build Windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-mbedtls
      - name: Configure
        run: |
          sed -i "s|^win32:QMAKE_CXXFLAGS += /utf-8|win32-msvc:QMAKE_CXXFLAGS += /utf-8|" OpenRGB.pro
          qmake-qt5 OpenRGB.pro
      - name: Patch Makefile
        run: |
          sed -i "s|^CC            = @echo compiling \$< \&\& gcc|CC            = gcc|" Makefile.Release
          sed -i "s|^CXX           = @echo compiling \$< \&\& g++|CXX           = g++|" Makefile.Release
          sed -i "s|-DVERSION_STRING=[^ ]*\"[^\"]*\"[^ ]*|-DVERSION_STRING=\\\\\"dev\\\\\"|" Makefile.Release
          sed -i "s|-DBUILDDATE_STRING=[^ ]*\"[^\"]*\"[^ ]*|-DBUILDDATE_STRING=\\\\\"dev\\\\\"|" Makefile.Release
          sed -i "s|-DGIT_COMMIT_DATE=[^ ]*\"[^\"]*\"[^\"]*\"[^ ]*|-DGIT_COMMIT_DATE=\\\\\"dev\\\\\"|" Makefile.Release
          sed -i "s|-DGIT_COMMIT_ID=[^ ]*|-DGIT_COMMIT_ID=\\\\\"dev\\\\\"|" Makefile.Release
          sed -i "s|-DGIT_BRANCH=[^ ]*|-DGIT_BRANCH=\\\\\"dev\\\\\"|" Makefile.Release
          sed -i "s|^DEFINES       = |DEFINES       = -D_WIN32_WINNT=0x0A00 |" Makefile.Release
          sed -i "s|-DHID_HOTPLUG_ENABLED=1|-DHID_HOTPLUG_ENABLED=0|" Makefile.Release
          sed -i "s|^LIBS        =|LIBS        = -lole32 -loleaut32 -luuid -lwbemuuid -lsetupapi -lcfgmgr32 -lhid -lws2_32 -lwinhttp -ladvapi32 -liphlpapi -lhidapi -lusb-1.0 -lmbedtls -lmbedx509 -lmbedcrypto|" Makefile.Release
          sed -i "s|^OBJECTS       = |OBJECTS       = _intermediate_release/.obj/super_io.o |" Makefile.Release
      - name: Shim setenv
        run: |
          sed -i "27a #ifdef _WIN32\\nstatic int setenv(const char* n,const char* v,int o){if(!o\&\&getenv(n))return 0;return _putenv_s(n,v);}\\nstatic int unsetenv(const char* n){return _putenv_s(n,\"\");}\\n#endif" dependencies/hueplusplus-1.2.0/src/TimePattern.cpp
      - name: Build super_io
        run: |
          CXXF=$(grep -m1 "^CXXFLAGS" Makefile.Release | sed "s/^CXXFLAGS *= *//")
          INCP=$(grep -m1 "^INCPATH" Makefile.Release | sed "s/^INCPATH *= *//")
          DEFS=$(grep -m1 "^DEFINES" Makefile.Release | sed "s/^DEFINES *= *//")
          mkdir -p _intermediate_release/.obj
          eval g++ -c $CXXF $DEFS $INCP -o _intermediate_release/.obj/super_io.o super_io/super_io.cpp
      - name: Build
        run: |
          mingw32-make -f Makefile.Release SHELL=/usr/bin/bash -j$(nproc)
      - name: Deploy
        run: |
          mkdir -p dist
          cp release/OpenRGB.exe dist/ 2>/dev/null || cp OpenRGB.exe dist/
          cd dist
          windeployqt-qt5 OpenRGB.exe || windeployqt OpenRGB.exe
          for d in libhidapi libusb-1.0 libmbedtls libmbedx509 libmbedcrypto libgcc_s_seh-1 libstdc++-6 libwinpthread-1; do cp /mingw64/bin/$d.dll . 2>/dev/null || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-Windows-B850S
          path: dist/
